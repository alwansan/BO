name: BO-COOP room network game bridge source preflight
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/prepare_room_network.py'
      - 'coop/prepare_original_system_lifetime.py'
      - 'coop/room_network_prepare_checks.py'
      - 'coop/room_network/**'
      - 'coop/lobby/**'
      - '.github/workflows/black-coop-room-network-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: coop
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: RanggaCasper/Black-Android
          ref: f3754d6985a8c35204e7df071546e586b10f1806
          path: reference
          persist-credentials: false
      - name: Fail-closed room network source stages, no game assets
        env:
          BO_UPSTREAM_REFERENCE: ${{ github.workspace }}/reference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s bo/coop -p room_network_prepare_checks.py -v
          python3 -m unittest discover -s bo/coop -p room_ui_prepare_checks.py -v
          echo 'ROOM_NET_STAGE_PASS: in-game Flash -> Android source transformation is atomic; NO game APK/gameplay claimed'
      - uses: actions/checkout@v4
        with:
          repository: TGP482/XboxXBE-Recomp
          ref: 99078b119b5d5e0d1d6afb1390e29437c0c984c0
          path: android-sdk
          persist-credentials: false
      - name: Verify actual pinned SDK system allocator lifetime reuse
        shell: bash
        run: |
          set -euo pipefail
          python3 bo/coop/prepare_original_system_lifetime.py --sdk android-sdk
          g++ -std=c++20 -O1 -g -pthread -I android-sdk/runtime \
            android-sdk/runtime/kernel/memory.cpp \
            bo/coop/room_network/test_original_system_allocator_lifetime.cpp \
            -o "$RUNNER_TEMP/test_system_allocator_lifetime"
          "$RUNNER_TEMP/test_system_allocator_lifetime"
      - name: Compile original host proxy and player storage headers against pinned Android Xbox SDK
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/original_actor_header_smoke.cpp" <<'CPP'
          #include "room_original_host_player_storage_kernel.hpp"
          #include "room_original_host_player_shadow_plan.hpp"
          #include "room_original_host_player_link_exchange.hpp"
          #include <type_traits>
          static_assert(std::is_base_of_v<blackcoop::OriginalHostProxyKernelIO,
                                          blackcoop::OriginalPlayerStorageKernelIO>);
          template<class IO>
          concept CanWriteP2GuestDirectly = requires(IO& io){
            io.WriteOwned(0x10000u,static_cast<const void*>(nullptr),0x40u);
          };
          static_assert(!CanWriteP2GuestDirectly<blackcoop::OriginalPlayerStorageKernelIO>);
          template<class IO>
          concept CanMapActorDirectly = requires(IO& io){
            io.MapOriginalActor(0x10000u,0x900u);
          };
          static_assert(!CanMapActorDirectly<blackcoop::OriginalActorExchangeKernelIO>);
          struct DisabledPresentation {
            bool CanEnterOriginal(const blackcoop::OriginalSetupScene&) { return false; }
            bool EnterOriginal(const blackcoop::OriginalSetupScene&) { return false; }
            bool OriginalContextActive(const blackcoop::OriginalSetupScene&) { return false; }
            bool RestoreOriginal(const blackcoop::OriginalSetupScene&) { return false; }
            bool OriginalP1Restored(const blackcoop::OriginalSetupScene&) { return false; }
          };
          void compile_only(X86Context& ctx, uint64_t (*scene)() noexcept,
                            uint64_t (*generation)(uint32_t,uint32_t) noexcept) {
            blackcoop::OriginalPlayerStorageKernelIO owned(ctx, scene,
                &mem::CoopSystemAllocationGeneration);
            blackcoop::OriginalProxySceneLedger ledger;
            blackcoop::OriginalHostProxyEngine guard(ledger);
            (void) owned.OwnsActor(0x10000u,0x900u);
            (void) guard.RequiresEngineCleanup();
            blackcoop::OriginalHostPlayerShadowPlan plan;
            blackcoop::OriginalPlayerStorageScene binding{};
            blackcoop::OriginalPlayerStorageView buffers{};
            (void) plan.Prepare(owned,binding,buffers);
            (void) plan.SourceStillCurrent(owned);
            // CopyIntoOwned is private: only the quarantined Stage may call it.
            blackcoop::OriginalHostPlayerStage staged;
            (void) staged.MaterializeOwned(owned);
            blackcoop::OriginalPlayerLinkExchangePlan linkScope;
            (void) staged.PrepareReadOnlyOriginalLinks(owned,linkScope);
            blackcoop::OriginalActorExchangeKernelIO actorIo(owned,binding,
                                                              buffers.actor,generation);
            (void) linkScope.Prepare(actorIo,binding,buffers.actor);
            (void) linkScope.EnterActorOnly(actorIo);
            (void) linkScope.RestoreActorOnly(actorIo);
            blackcoop::OriginalActorExchangeKernelIO systemOnly(owned,binding,buffers.actor,
                &mem::CoopSystemAllocationGeneration);
            (void) systemOnly.Live();
            DisabledPresentation disabled;
            blackcoop::OriginalSetupKernelIO<DisabledPresentation> setupIo(
                ctx,owned,binding,staged.MaterializedView(owned),generation,disabled);
            blackcoop::OriginalHumanSetupTick setup;
            blackcoop::OriginalSetupScene setupScene{};
            (void) setup.Bind(setupIo,setupScene);
            (void) setup.Tick(setupIo,1u);
          }
          CPP
          g++ -std=c++20 -pthread -fsyntax-only \
            -I bo/coop/room_network -I android-sdk/runtime \
            "$RUNNER_TEMP/original_actor_header_smoke.cpp"
          echo 'ANDROID_ORIGINAL_ACTOR_HEADER_PASS: pinned SDK compatibility only, NO actor created or game run'
      - name: Original player shadow source planning without original guest writes
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_player_shadow_plan.cpp -o "$RUNNER_TEMP/test_original_player_shadow"
          "$RUNNER_TEMP/test_original_player_shadow"
      - name: Source-accurate original P1 grid and dynamic neighbor link exchange (read-only)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_player_link_exchange.cpp -o "$RUNNER_TEMP/test_original_player_link_exchange"
          "$RUNNER_TEMP/test_original_player_link_exchange"
      - name: Original soldier real clone ownership regression
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined bo/coop/room_network/test_original_soldier_copy.cpp -o "$RUNNER_TEMP/test_soldier_copy"
          "$RUNNER_TEMP/test_soldier_copy"
      - name: Original host physics proxy ownership and rollback regression
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_proxy_engine.cpp -o "$RUNNER_TEMP/test_host_proxy_engine"
          "$RUNNER_TEMP/test_host_proxy_engine"
      - name: Original owned player storage and camera constructor lifecycle
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_player_storage.cpp -o "$RUNNER_TEMP/test_player_storage"
          "$RUNNER_TEMP/test_player_storage"
      - name: Original animation context exchange and ownership regression
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_animation_context.cpp -o "$RUNNER_TEMP/test_original_animation_context"
          "$RUNNER_TEMP/test_original_animation_context"
      - name: Source-authentic original post 1F1080 world-frame gate (read-only)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_post_frame_contract.cpp -o "$RUNNER_TEMP/test_post_original_world_frame"
          "$RUNNER_TEMP/test_post_original_world_frame"
      - name: Original host TLS peer pad ports 1-3 (read-only, no game)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_remote_pad_plan.cpp -o "$RUNNER_TEMP/test_remote_pad_ports"
          "$RUNNER_TEMP/test_remote_pad_ports"
      - name: Original native Xbox ports 1-3 authenticated TLS adapter (actor gate fail closed)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_pad_port_bridge.cpp -o "$RUNNER_TEMP/test_native_remote_pad_bridge"
          "$RUNNER_TEMP/test_native_remote_pad_bridge"
      - name: Original multi-frame 1E0E40 P2 P3 P4 lifecycle guard
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_setup_tick.cpp -o "$RUNNER_TEMP/test_original_setup_tick"
          "$RUNNER_TEMP/test_original_setup_tick"
      - name: Parallel ORIGINAL host P2 P3 P4 lifecycle lanes (C++ ASan/UBSan)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_host_multi_actor_lanes.cpp -o "$RUNNER_TEMP/test_original_multi_lanes"
          "$RUNNER_TEMP/test_original_multi_lanes"
      - name: Canonical original guest NPC avatar host world barrier (C++ ASan/UBSan)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined bo/coop/room_network/test_room_original_guest_canonical_source_barrier.cpp -o "$RUNNER_TEMP/test_guest_host_story_barrier"
          "$RUNNER_TEMP/test_guest_host_story_barrier"
      - name: Native original first-person camera eye quantization guards
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined             bo/coop/room_network/test_room_original_eye_contract.cpp -o "$RUNNER_TEMP/test_original_eye"
          "$RUNNER_TEMP/test_original_eye"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined             bo/coop/room_network/test_room_nonfrontend_original_player.cpp -o "$RUNNER_TEMP/test_nonfrontend"
          "$RUNNER_TEMP/test_nonfrontend"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined             bo/coop/room_network/test_original_launch_difficulty_contract.cpp -o "$RUNNER_TEMP/test_original_difficulty"
          "$RUNNER_TEMP/test_original_difficulty"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_mission_field_hint.cpp -o "$RUNNER_TEMP/test_original_mission_hint"
          "$RUNNER_TEMP/test_original_mission_hint"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_streaming_stage_contract.cpp -o "$RUNNER_TEMP/test_streaming_source"
          "$RUNNER_TEMP/test_streaming_source"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_core_phase_witness.cpp -o "$RUNNER_TEMP/test_core_phase"
          "$RUNNER_TEMP/test_core_phase"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_core_stage_identity_contract.cpp -o "$RUNNER_TEMP/test_core_stage_identity"
          "$RUNNER_TEMP/test_core_stage_identity"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_bot_pool_contract.cpp -o "$RUNNER_TEMP/test_original_bot_pool"
          "$RUNNER_TEMP/test_original_bot_pool"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_host_physics_proxy_contract.cpp -o "$RUNNER_TEMP/test_original_host_physics_pool"
          "$RUNNER_TEMP/test_original_host_physics_pool"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_host_extra_actor_contract.cpp -o "$RUNNER_TEMP/test_extra_host_actor_gate"
          "$RUNNER_TEMP/test_extra_host_actor_gate"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_remote_human_motion_contract.cpp -o "$RUNNER_TEMP/test_original_human_motion"
          "$RUNNER_TEMP/test_original_human_motion"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_trusted_input_contract.cpp -o "$RUNNER_TEMP/test_tls_human_inbox"
          "$RUNNER_TEMP/test_tls_human_inbox"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_room_original_guest_pad_contract.cpp -o "$RUNNER_TEMP/test_guest_pad"
          "$RUNNER_TEMP/test_guest_pad"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_local_pad_tap.cpp -o "$RUNNER_TEMP/test_touch_pad_tap"
          "$RUNNER_TEMP/test_touch_pad_tap"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_guest_host_world_contract.cpp -o "$RUNNER_TEMP/test_guest_host_world"
          "$RUNNER_TEMP/test_guest_host_world"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_guest_host_object_contract.cpp -o "$RUNNER_TEMP/test_guest_host_object"
          "$RUNNER_TEMP/test_guest_host_object"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_guest_prepared_story_contract.cpp -o "$RUNNER_TEMP/test_guest_story_prepare"
          "$RUNNER_TEMP/test_guest_story_prepare"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=undefined \
            bo/coop/room_network/test_room_original_guest_launch_match_contract.cpp -o "$RUNNER_TEMP/test_guest_launch_match"
          "$RUNNER_TEMP/test_guest_launch_match"
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            bo/coop/room_network/test_original_running_scene_source_gate.cpp -o "$RUNNER_TEMP/test_running_scene"
          "$RUNNER_TEMP/test_running_scene"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compile Android room form and all staged Java 8 sources
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk/sdkmanager" --install 'platforms;android-34' </dev/null
          scratch="$RUNNER_TEMP/bo-room-net-source"
          mkdir -p "$scratch/stage" "$scratch/java"
          trap 'rm -rf "$scratch"' EXIT
          python3 - <<'PY'
          import pathlib,os,shutil,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'bo-room-net-source/stage'
          upstream=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'reference'
          sys.path.insert(0,'bo/coop')
          from prepare_room_network import INPUTS,prepare
          for name in INPUTS:
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(upstream/name,p)
          changes=prepare(root)
          assert len(changes)>=26
          print('Staged source files',len(changes))
          PY
          javac --release 8 -Xlint:all,-options -Werror \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d "$scratch/java" \
            "$scratch/stage"/app/src/main/java/com/racas/black/coop/*.java
          echo 'ROOM_NET_JAVA_PASS: Android Java source compile only, not a game APK'
