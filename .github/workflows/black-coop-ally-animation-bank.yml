name: BO-COOP private original owner RCB-linked animation bank clip boundary audit
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/ally_animation_bank_gate.py'
      - 'coop/analysis/test_ally_animation_bank_gate.py'
      - '.github/workflows/black-coop-ally-animation-bank.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-coop-private-original-bank-boundary
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Test fake RCB v21 and BNKS v8 encoding4 track offsets and malformed data
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_ally_animation_bank_gate.py -v
          echo 'BO_RCB_BANK_TRACK_SYNTHETIC_PASS: no original game content'
  private-owner:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: |
            coop/analysis/model_inventory.py
            coop/analysis/ally_model_geometry_gate.py
            coop/analysis/ally_rcb_hierarchy_gate.py
            coop/analysis/ally_animation_bank_gate.py
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          persist-credentials: false
          path: owner-biso
          sparse-checkout: |
            Black_Xbox_Extracted/levels/level_00/stg_0001/StLevel.bin
            Black_Xbox_Extracted/levels/level_07/stg_0001/StLevel.bin
            Black_Xbox_Extracted/levels/level_08/stg_0001/StLevel.bin
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Privately verify RCB-linked animation banks and encoding4 clip boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/ally_animation_bank_gate.py \
            --owner-root owner-biso/Black_Xbox_Extracted \
            --report "$RUNNER_TEMP/bo-ally-rcb-bank-safe-summary.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bo-ally-rcb-bank-safe-summary.json'
          r=json.loads(p.read_text())
          assert r['schema']=='BO-COOP-owner-rcb-bank-clip-boundaries-v1'
          assert r['files_read']==3
          assert not r['original_game_bytes_or_hashes_exported']
          assert not r['original_animation_pose_playable']
          assert not r['remote_human_ally_rendering_implemented']
          print('BO_RCB_BANK_OWNER_META_PASS: derived clip boundaries only; no animation pose or game actor')
          PY
      - name: Upload sanitized bounded track counts only
        uses: actions/upload-artifact@v4
        with:
          name: bo-owner-rcb-animation-track-safe-metadata
          path: ${{ runner.temp }}/bo-ally-rcb-bank-safe-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete original owner assets from temporary CI runner
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/bo-ally-rcb-bank-safe-summary.json"
