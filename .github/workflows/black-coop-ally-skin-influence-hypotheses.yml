name: BO-COOP original owner MODEL packed influence hypotheses private CI
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/ally_skin_influence_hypotheses.py'
      - 'coop/analysis/test_ally_skin_influence_hypotheses.py'
      - '.github/workflows/black-coop-ally-skin-influence-hypotheses.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-private-skin-influence-hypotheses
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Bounded synthetic active-influence and negative-control tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_ally_skin_influence_hypotheses.py -v
          echo 'BO_OWNER_SKIN_HYPOTHESES_SYNTHETIC_PASS: no original animation assumed'
  owner-private:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: |
            coop/analysis/model_inventory.py
            coop/analysis/ally_model_geometry_gate.py
            coop/analysis/ally_vertex36_layout_probe.py
            coop/analysis/ally_skin_influence_hypotheses.py
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          persist-credentials: false
          path: owner-biso
          sparse-checkout: |
            Black_Xbox_Extracted/levels/level_00/stg_0001/StLevel.bin
            Black_Xbox_Extracted/levels/level_07/stg_0001/StLevel.bin
            Black_Xbox_Extracted/levels/level_08/stg_0001/StLevel.bin
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Compare private owner candidates and export only bounded counts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/ally_skin_influence_hypotheses.py \
            --owner-root owner-biso/Black_Xbox_Extracted \
            --report "$RUNNER_TEMP/bo-skin-influence-safe.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bo-skin-influence-safe.json'
          x=json.loads(p.read_text())
          assert x['schema']=='bo-owner-stride36-skin-influence-hypothesis-v1'
          assert x['stage_count']==3 and x['model_candidates']==12
          assert x['buffer_candidates']==36
          assert x['original_vertex_words_exported'] is False
          assert x['original_bone_indices_exported'] is False
          assert x['actual_shader_binding_proven'] is False
          assert x['real_bone_weights_decoded'] is False
          assert p.stat().st_size<131072
          print('BO_OWNER_SKIN_HYPOTHESES_PRIVATE_PASS: anonymous comparisons only')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bo-skin-influence-anonymized-counts
          path: ${{ runner.temp }}/bo-skin-influence-safe.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge pinned original owner files and local safe report
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/bo-skin-influence-safe.json"
