name: BO-COOP original human body stride36 private lane classification
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/ally_vertex36_layout_probe.py'
      - 'coop/analysis/test_ally_vertex36_layout_probe.py'
      - '.github/workflows/black-coop-ally-vertex36-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-coop-private-vertex36-lane-stats
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Exercise bounded stride36 fake MODEL buffers and redacted aggregates
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_ally_vertex36_layout_probe.py -v
          echo 'BO_OWNER_VERTEX36_SYNTHETIC_PASS: unknown skinning layout not guessed'
  owner-private:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: |
            coop/analysis/model_inventory.py
            coop/analysis/ally_model_geometry_gate.py
            coop/analysis/ally_vertex36_layout_probe.py
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          persist-credentials: false
          path: owner-biso
          sparse-checkout: |
            Black_Xbox_Extracted/levels/level_00/stg_0001/StLevel.bin
            Black_Xbox_Extracted/levels/level_07/stg_0001/StLevel.bin
            Black_Xbox_Extracted/levels/level_08/stg_0001/StLevel.bin
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Count aggregate vertex36 slots privately on pinned owner MODEL resources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/ally_vertex36_layout_probe.py \
            --owner-root owner-biso/Black_Xbox_Extracted \
            --report "$RUNNER_TEMP/bo-owner-vertex36-lane-safe.json"
          python3 - <<'PY'
          import json,os,pathlib
          result=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'bo-owner-vertex36-lane-safe.json').read_text())
          assert result['schema']=='BO-COOP-owned-stride36-lane-statistics-v1'
          assert result['files_checked']==3
          assert result['all_original_vertex_words_and_vertex_flags_redacted']
          assert not result['skin_weight_or_bone_index_offset_proven']
          assert not result['model_vertex_pose_renderer_built']
          print('BO_OWNER_VERTEX36_PRIVATE_STATS_PASS: derived statistics only; not skin weights')
          PY
      - name: Upload bounded non-proprietary derived summary only
        uses: actions/upload-artifact@v4
        with:
          name: bo-owner-vertex36-statistics-safe
          path: ${{ runner.temp }}/bo-owner-vertex36-lane-safe.json
          if-no-files-found: error
          retention-days: 7
      - name: Purge original owner files after processing
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/bo-owner-vertex36-lane-safe.json"
