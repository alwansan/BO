name: BO-COOP pinned original XBE mission candidate field widths (NO GAMEPLAY)
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/original_mission_field_widths.py'
      - 'coop/analysis/test_original_mission_field_widths.py'
      - '.github/workflows/black-coop-original-mission-field-widths.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-original-mission-field-widths
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Verify x86 BYTE vs unspecified width and reject unpinned binary
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_original_mission_field_widths.py -v
  owner-private:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          path: owner-biso
          sparse-checkout: Black_Xbox_Extracted/default.xbe
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
      - name: Pinned original mission candidate direct-memory field width survey only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/original_mission_field_widths.py \
            --owner-xbe owner-biso/Black_Xbox_Extracted/default.xbe \
            --report "$RUNNER_TEMP/bo-original-field-width-categories.json"
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ["RUNNER_TEMP"])/"bo-original-field-width-categories.json"
          d=json.loads(f.read_text())
          assert d["schema"]=="bo-original-xbe-mission-field-width-only-v1"
          assert d["pinned_owner_xbe_sha1_checked"]
          assert len(d["source_windows"])==3
          assert d["read_only_source_evidence"]
          assert not d["selected_campaign_mission_proven"]
          assert not d["original_guest_scene_loader_proven"]
          assert not d["original_instructions_or_bytes_exported"]
          assert f.stat().st_size<=4500
          print("BO_PRIVATE_ORIGINAL_MISSION_WIDTHS_PASS: only fixed-address and width counters; original binary stays private")
          PY
      - name: Upload bounded numeric derived metadata only
        uses: actions/upload-artifact@v4
        with:
          name: bo-original-mission-field-width-counters
          path: ${{ runner.temp }}/bo-original-field-width-categories.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete original XBE and temp metadata
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/bo-original-field-width-categories.json"
