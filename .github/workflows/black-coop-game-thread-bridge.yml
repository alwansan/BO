name: BO-COOP isolated game-thread bridge preflight
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/bridge/**'
      - '.github/workflows/black-coop-game-thread-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            coop/bridge
            coop/native/net_core.hpp
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Build bounded C++20 game-thread queue under sanitizers
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            coop/bridge/test_scene_inbox.cpp -o /tmp/bo-coop-inbox-tests
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            coop/bridge/test_transport_pipeline.cpp -o /tmp/bo-coop-transport-pipeline
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            coop/bridge/test_remote_proxy_roster.cpp -o /tmp/bo-coop-actor-proxy-roster
      - name: Verify validation, capacity, scene barriers and thread ownership
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          /tmp/bo-coop-inbox-tests
          /tmp/bo-coop-transport-pipeline
          /tmp/bo-coop-actor-proxy-roster
