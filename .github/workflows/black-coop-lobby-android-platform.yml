name: BO-COOP Android Keystore and real TLS platform test
on:
  push:
    branches: [experiment/black-coop]
    paths: ['coop/lobby/**', '.github/workflows/black-coop-lobby-android-platform.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: black-coop-lobby-android-platform
  cancel-in-progress: false
jobs:
  keystore-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/lobby
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build synthetic test APK and run Android 29 emulator instrumentation
        shell: bash
        run: bash coop/lobby/run_android_platform_test.sh
      - name: Remove synthetic APKs and test identities
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/black-tls-platform"
