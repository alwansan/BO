name: BO-COOP original 2006 BLACK human bot puppet draw private source survey (NO ACTOR)
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/original_bot_puppet_draw_xbe.py'
      - 'coop/analysis/test_original_bot_puppet_draw_xbe.py'
      - '.github/workflows/black-coop-original-puppet-draw-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-original-puppet-draw-private
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Original XBE data isolation and bounded original draw gate regression
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_original_bot_puppet_draw_xbe.py -v
  owner-private:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          path: owner-biso
          sparse-checkout: Black_Xbox_Extracted/default.xbe
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
      - name: Private original XBE render candidates numeric-only
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/original_bot_puppet_draw_xbe.py \
            --owner-xbe owner-biso/Black_Xbox_Extracted/default.xbe \
            --report "$RUNNER_TEMP/original-puppet-draw-numeric.json"
          python3 - <<'PY'
          import json,os,pathlib
          file=pathlib.Path(os.environ["RUNNER_TEMP"])/"original-puppet-draw-numeric.json"
          report=json.loads(file.read_text())
          assert report["schema"]=="bo-private-original-puppet-draw-source-v1"
          assert report["owner_xbe_sha1_pinned"]
          assert len(report["owner_original_candidate_windows"])==2
          assert all(v["original_executable_candidate"] for v in report["owner_original_candidate_windows"].values())
          assert report["source_prototype_draw_virtual_slot"]==5
          assert not report["android_guest_call_abi_verified"]
          assert not report["android_original_scene_actor_creation_verified"]
          assert not report["android_avatar_drawn_in_game_verified"]
          assert not report["original_binary_or_disassembly_exported"]
          assert file.stat().st_size<2900
          print("BO_PRIVATE_OWNER_PUPPET_DRAW_SOURCE_CANDIDATES_PASS_NO_ACTOR")
          PY
      - name: Export aggregate private counts only
        uses: actions/upload-artifact@v4
        with:
          name: bo-original-puppet-draw-numeric-only
          path: ${{ runner.temp }}/original-puppet-draw-numeric.json
          if-no-files-found: error
          retention-days: 7
      - name: Destroy owner XBE and private report
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/original-puppet-draw-numeric.json"
