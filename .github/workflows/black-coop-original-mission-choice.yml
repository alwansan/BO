name: BO-COOP original mission menu refs private XBE source survey
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/original_mission_choice_xrefs.py'
      - 'coop/analysis/test_original_mission_choice_xrefs.py'
      - '.github/workflows/black-coop-original-mission-choice.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-private-original-mission-choice
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Synthetic x86 mission entry mapping and output privacy
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_original_mission_choice_xrefs.py -v
  owner-private:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          path: owner-biso
          sparse-checkout: Black_Xbox_Extracted/default.xbe
          sparse-checkout-cone-mode: false
          lfs: false
          persist-credentials: false
      - name: Original mission menu code neighborhood, read only and private
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/original_mission_choice_xrefs.py \
            --owner-xbe owner-biso/Black_Xbox_Extracted/default.xbe \
            --report "$RUNNER_TEMP/bo-original-mission-hints-safe.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bo-original-mission-hints-safe.json'
          data=json.loads(p.read_text())
          assert data['schema']=='bo-private-original-mission-choice-global-hints-v1'
          assert len(data['entries'])==3
          assert not data['original_mission_id_proven']
          assert not data['original_scene_loaded_stage_epoch_verified']
          assert not data['raw_proprietary_bytes_or_disassembly_exported']
          assert p.stat().st_size<=9500
          print('BO_MISSION_XBE_PRIVATE_PASS: only small derived metadata leaves runner')
          PY
      - name: Upload safe derived summary only
        uses: actions/upload-artifact@v4
        with:
          name: bo-original-mission-menu-global-hints-safe
          path: ${{ runner.temp }}/bo-original-mission-hints-safe.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete owner XBE from ephemeral runner
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/bo-original-mission-hints-safe.json"
