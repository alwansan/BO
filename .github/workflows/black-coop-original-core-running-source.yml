name: BO-COOP pinned XBE original game core phase candidate survey (NO SCENE PROOF)
on:
  push:
    branches: [experiment/black-coop]
    paths:
      - 'coop/analysis/original_core_running_xbe.py'
      - 'coop/analysis/test_original_core_running_xbe.py'
      - '.github/workflows/black-coop-original-core-running-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bo-core-phase-pinned
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Byte-offset source candidate and owner identity regression
        run: |
          set -euo pipefail
          python3 -m unittest discover -s coop/analysis -p test_original_core_running_xbe.py -v
  owner-private:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: bo
          sparse-checkout: coop/analysis
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/biso
          ref: 9ceb6a65fb5a4414c106ca3961295a1f8f7e558b
          path: owner-biso
          sparse-checkout: Black_Xbox_Extracted/default.xbe
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
      - name: Static pinned game core relative state offsets, never scene ready
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 bo/coop/analysis/original_core_running_xbe.py \
            --owner-xbe owner-biso/Black_Xbox_Extracted/default.xbe \
            --report "$RUNNER_TEMP/bo-core-private.json"
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ["RUNNER_TEMP"])/"bo-core-private.json"
          d=json.loads(f.read_text())
          assert d["schema"]=="bo-core-phase-candidate-private-v1"
          assert d["owner_source_pinned"]
          assert len(d["windows"])==3
          for k in ("core_phase_semantics_proven","scene_loaded_proven",
                    "safe_guest_loader_proven","remote_actor_proven",
                    "original_bytes_or_disassembly_exported"):
              assert not d[k]
          assert f.stat().st_size<=3000
          print("BO_ORIGINAL_CORE_PHASE_PRIVATE_CI_PASS: sanitized counts")
          PY
      - name: Export bounded source-derived counts only
        uses: actions/upload-artifact@v4
        with:
          name: bo-core-phase-readonly-derived
          path: ${{ runner.temp }}/bo-core-private.json
          if-no-files-found: error
          retention-days: 7
      - name: Destroy original XBE workspace
        if: always()
        run: |
          rm -rf owner-biso
          rm -f "$RUNNER_TEMP/bo-core-private.json"
